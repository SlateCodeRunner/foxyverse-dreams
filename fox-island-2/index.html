<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Foxy Island 2 · the undertow</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050309;color:#e8e0f0;font-family:'Fira Code',ui-monospace,monospace;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#140c24 0%,#050309 70%)}
#stage{position:relative;width:min(100vw,calc(100vh*20/12));aspect-ratio:20/12;box-shadow:0 0 60px rgba(160,107,255,.12)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.hide{display:none!important}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;pointer-events:none;font-size:clamp(8px,1.5vw,12px);letter-spacing:1px;text-shadow:0 1px 2px #000}
#frags span{display:inline-block;margin-right:4px;color:#4a3f66;font-size:1.5em}
#frags span.on{color:#ffd27a;text-shadow:0 0 8px #ffb347}
#zone{opacity:.7;text-align:center;flex:1}
#form{padding:2px 8px;border:1px solid #4a3f66;border-radius:3px;color:#c9b8ff;background:rgba(10,6,20,.6)}
#form.sh{border-color:#a06bff;color:#fff;box-shadow:0 0 10px #a06bff}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);max-width:86%;padding:6px 12px;background:rgba(10,6,20,.88);border:1px solid #4a3f66;border-radius:4px;font-size:clamp(9px,1.6vw,13px);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
#dlg{position:absolute;left:3%;right:3%;bottom:4%;padding:12px 16px 10px;background:rgba(8,5,16,.94);border:1px solid #e8833a;border-radius:4px;box-shadow:0 0 18px rgba(232,131,58,.18);font-size:clamp(10px,1.9vw,15px);line-height:1.6;cursor:pointer}
#dn{color:#e8833a;font-size:.8em;letter-spacing:2px;text-transform:lowercase;margin-bottom:2px;min-height:1em}
#dt{min-height:3.2em;color:#efe8f7;white-space:pre-wrap}
#dc{display:flex;flex-direction:column;gap:5px;margin-top:6px}
#dc button{font:inherit;text-align:left;padding:6px 10px;background:#160e26;color:#e8e0f0;border:1px solid #4a3f66;border-radius:3px;cursor:pointer}
#dc button:hover,#dc button:focus{border-color:#e8833a;color:#fff;outline:none}
#dk{position:absolute;right:10px;bottom:4px;font-size:.65em;opacity:.4}
#duel{position:absolute;inset:0;background:rgba(5,3,9,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center}
#du-name{letter-spacing:3px;color:#e8833a;font-size:clamp(10px,1.8vw,14px)}
#du-pips{font-size:clamp(14px,3vw,24px);color:#ff6b8a;letter-spacing:6px}
#du-round{font-size:clamp(8px,1.4vw,11px);opacity:.55;letter-spacing:2px}
#du-line{max-width:90%;min-height:4.2em;font-size:clamp(11px,2.3vw,18px);line-height:1.6;color:#fff}
#du-msg{min-height:1.4em;font-size:clamp(9px,1.7vw,13px);color:#ffd27a}
#du-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#du-btns button{font:inherit;font-size:clamp(9px,1.6vw,13px);padding:9px 12px;background:#160e26;color:#e8e0f0;border:1px solid #a06bff;border-radius:3px;cursor:pointer;max-width:220px}
#du-btns button small{display:block;opacity:.55;font-size:.78em;margin-top:2px}
#du-btns button:hover{background:#241440;border-color:#fff}
#du-btns button:disabled{opacity:.4;cursor:default}
#title,#endscr{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#1d1033 0%,#050309 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;z-index:50}
#title h1{font-weight:500;letter-spacing:.35em;font-size:clamp(18px,5vw,40px);color:#e8833a;text-shadow:0 0 24px rgba(232,131,58,.4)}
#title h2,#endscr h2{font-weight:300;letter-spacing:.5em;font-size:clamp(10px,2.4vw,18px);color:#a06bff}
.tag{font-size:clamp(10px,1.8vw,14px);opacity:.75}
.btn{font:inherit;font-size:clamp(11px,2vw,16px);padding:9px 22px;background:transparent;color:#e8e0f0;border:1px solid #e8833a;border-radius:3px;cursor:pointer;letter-spacing:2px}
.btn:hover{background:#e8833a;color:#050309}
#help{font-size:clamp(8px,1.4vw,11px);opacity:.5;line-height:1.9;max-width:92%}
#endscr p{max-width:88%;font-size:clamp(11px,2vw,16px);line-height:1.8}
#endscr h1{font-weight:400;color:#ffd27a;letter-spacing:.2em;font-size:clamp(16px,4vw,30px)}
#pad{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none}
#pad>div{position:fixed;bottom:12px;pointer-events:auto;display:none}
@media (pointer:coarse){#pad>div{display:grid}}
#dpad{left:12px;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px}
#dpad button,#abtns button{font:inherit;background:rgba(22,14,38,.78);color:#e8e0f0;border:1px solid #4a3f66;border-radius:8px;font-size:18px}
#dpad button:active,#abtns button:active{background:#e8833a;color:#050309}
#abtns{right:12px;grid-template-columns:repeat(2,58px);grid-template-rows:repeat(2,58px);gap:6px}
#mute{position:absolute;right:8px;bottom:6px;font-size:10px;opacity:.35;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="cv" width="320" height="192"></canvas>
  <div id="hud"><div id="frags"></div><div id="zone"></div><div id="form">fox</div></div>
  <div id="toast"></div>
  <div id="dlg" class="hide"><div id="dn"></div><div id="dt"></div><div id="dc"></div><div id="dk">E · space</div></div>
  <div id="duel" class="hide"><div id="du-name"></div><div id="du-round"></div><div id="du-pips"></div><div id="du-line"></div><div id="du-msg"></div><div id="du-btns"></div></div>
  <div id="endscr" class="hide"><h2 id="en-sub"></h2><h1 id="en-title"></h1><p id="en-text"></p><p class="tag" id="en-shells"></p><button class="btn" id="en-again">okay hi 🦊 again</button></div>
  <div id="title">
    <h2>the undertow</h2>
    <h1>FOXY ISLAND 2</h1>
    <div class="tag">okay hi 🦊</div>
    <div class="tag" style="opacity:.55">the tide went out. the island didn't end.</div>
    <button class="btn" id="b-new">begin</button>
    <button class="btn hide" id="b-cont">continue</button>
    <div id="help">arrows / wasd move · E or space talks and pulls · Q splits you from your shadow, Q again brings it home · H hints · M sound</div>
  </div>
  <div id="mute">sound: on</div>
</div></div>
<div id="pad">
  <div id="dpad"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><span></span><button data-k="right">▶</button><span></span><button data-k="down">▼</button><span></span></div>
  <div id="abtns"><button data-k="act">E</button><button data-k="split">Q</button><button data-k="hint">?</button><button data-k="mute">♪</button></div>
</div>
<script src="data.js"></script>
<script src="talk.js"></script>
<script src="render.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
